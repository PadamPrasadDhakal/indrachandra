<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BBS 3rd year question papers - Indrachandra Campus.">
  <title>BBS Questions | Indrachandra Campus</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .questions-shell {
      width: min(980px, calc(100% - 2rem));
      margin: 2rem auto 3rem;
    }

    .questions-header {
      background: linear-gradient(145deg, #ffffff, #eef5ff);
      border: 1px solid #d6e6ff;
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .questions-list {
      display: grid;
      gap: 0.9rem;
    }

    .question-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.1rem;
      background: linear-gradient(145deg, #ffffff, #f2f8ff);
      border: 1px solid #d9e8ff;
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink-900);
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .question-card:hover {
      transform: translateY(-3px);
      border-color: #9ec4ff;
      box-shadow: var(--shadow-lift);
    }

    .question-name {
      margin: 0;
      font-weight: 700;
    }

    .question-open {
      white-space: nowrap;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--blue-800);
      background: #eaf3ff;
      border: 1px solid #bfd8ff;
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1rem;
      text-decoration: none;
      color: var(--white);
      background: linear-gradient(145deg, var(--blue-800), var(--blue-700));
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-weight: 700;
      box-shadow: var(--shadow-soft);
    }

    @media (max-width: 640px) {
      .question-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="questions-shell">
    <section class="questions-header">
      <h1 class="section-title">BBS 3rd Year Questions</h1>
      <p class="section-subtitle">Click any subject below to open the PDF question file.</p>
    </section>

    <section class="questions-list" aria-label="BBS question files">
      <a class="question-card" href="bbs%203rd%20year%20business%20enviroment%20qn%20.pdf" target="_blank" rel="noopener noreferrer">
        <p class="question-name">Business Environment - BBS 3rd Year</p>
        <span class="question-open">Open PDF</span>
      </a>

      <a class="question-card" href="bbs%203rd%20year%20business%20law1n.pdf" target="_blank" rel="noopener noreferrer">
        <p class="question-name">Business Law - BBS 3rd Year</p>
        <span class="question-open">Open PDF</span>
      </a>

      <a class="question-card" href="BBS_3rd_year_marketing_qn.pdf" target="_blank" rel="noopener noreferrer">
        <p class="question-name">Marketing - BBS 3rd Year</p>
        <span class="question-open">Open PDF</span>
      </a>
    </section>

    <a class="back-link" href="index.html">Back to Home</a>
  </main>
</body>
</html>
